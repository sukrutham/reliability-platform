apiVersion: apps/v1
kind: Deployment
metadata:
  name: reliability-platform
  namespace: reliability-platform
  labels:
    app: reliability-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reliability-platform
  template:
    metadata:
      labels:
        app: reliability-platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: api
          image: ghcr.io/sukrutham/reliability-platform:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: reliability-platform-config
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
